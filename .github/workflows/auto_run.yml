name: Daily Weather Data Fetcher

# 実行タイマーの設定（例: 毎日AM6:00 UTC = 日本時間15:00 に自動実行）
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # 手動で即時テスト実行できるボタンも用意

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v3

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pythonスクリプトの実行
        run: python main.py

      - name: 更新された data.json をGitHubに自動保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto-update weather data" || exit 0
          git push
